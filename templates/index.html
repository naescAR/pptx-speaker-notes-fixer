<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Fixer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --error-color: #ef4444;
            --success-color: #10b981;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .drop-zone {
            width: 100%;
            padding: 40px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
        }

        .drop-zone-text {
            color: #cbd5e1;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .drop-zone-subtext {
            color: #64748b;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        button {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .status-container {
            margin-top: 24px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .status-message {
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            border-radius: 12px;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            text-align: center;
        }

        .status-message.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
            text-align: center;
        }
        
        .selected-file {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        
        .file-name {
            font-size: 14px;
            color: #93c5fd;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }
        
        .remove-file {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            width: auto;
        }
        
        .remove-file:hover {
            color: #f1f5f9;
            background: none;
            transform: none;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Presentation Fixer</h2>
        <p class="subtitle">Upload your PowerPoint (.pptx) file. We will perfectly center and resize your speaker notes for optimal printing.</p>
        
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div class="drop-zone-text">Click to upload or drag and drop</div>
            <div class="drop-zone-subtext">Only .pptx files are supported</div>
        </div>
        
        <input type="file" id="fileInput" accept=".pptx">
        
        <div id="selectedFile" class="selected-file">
            <div id="fileName" class="file-name"></div>
            <button class="remove-file" onclick="clearFile()">×</button>
        </div>
        
        <button id="uploadBtn" onclick="uploadFile()" disabled>Fix Presentation</button>
        
        <div class="status-container">
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const selectedFileDiv = document.getElementById('selectedFile');
        const fileNameDiv = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        let currentFile = null;

        // Drag and drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });
        
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });
        
        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.name.toLowerCase().endsWith('.pptx')) {
                    currentFile = file;
                    fileNameDiv.textContent = file.name;
                    dropZone.style.display = 'none';
                    selectedFileDiv.style.display = 'flex';
                    uploadBtn.disabled = false;
                    statusMessage.style.display = 'none';
                } else {
                    showStatus('Please upload a valid .pptx file.', 'error');
                }
            }
        }
        
        function clearFile() {
            currentFile = null;
            fileInput.value = '';
            dropZone.style.display = 'block';
            selectedFileDiv.style.display = 'none';
            uploadBtn.disabled = true;
        }

        async function uploadFile() {
            if (!currentFile) return;

            const formData = new FormData();
            formData.append('file', currentFile);

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<div class="spinner"></div> Fixing Notes...';
            statusMessage.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Start download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = currentFile.name.replace('.pptx', '_Fixed.pptx');
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    showStatus('Success! Your fixed presentation is downloading.', 'success');
                    uploadBtn.innerHTML = 'Fix Another Presentation';
                    uploadBtn.disabled = false;
                    
                    // Reset after 3 seconds
                    setTimeout(() => {
                        clearFile();
                        uploadBtn.innerHTML = 'Fix Presentation';
                    }, 3000);
                } else {
                    const data = await response.json();
                    showStatus(data.error || 'An error occurred during processing.', 'error');
                    uploadBtn.innerHTML = 'Fix Presentation';
                    uploadBtn.disabled = false;
                }
            } catch (error) {
                showStatus('Network error. Please try again.', 'error');
                uploadBtn.innerHTML = 'Fix Presentation';
                uploadBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            statusMessage.className = `status-message ${type}`;
            statusMessage.innerHTML = message;
        }
    </script>
</body>
</html>
