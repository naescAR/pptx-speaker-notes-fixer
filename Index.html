<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --error-color: #ef4444;
      --success-color: #10b981;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: translateY(0);
      transition: all 0.3s ease;
    }

    .container:hover {
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      opacity: 0.7;
    }

    .status-container {
      margin-top: 24px;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .status-message {
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      border-radius: 12px;
    }

    .status-message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-message.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.2);
      text-align: center;
    }

    .status-message.loading {
      display: block;
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.2);
      text-align: center;
    }

    .open-link {
      display: inline-block;
      margin-top: 16px;
      background: var(--success-color);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .open-link:hover {
      background: #059669;
      transform: translateY(-2px);
    }
    
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 20px;
      height: 20px;
      -webkit-animation: spin 1s linear infinite; /* Safari */
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Presentation Fixer</h2>
    <p class="subtitle">Quickly format and resize your Google Slides speaker notes for optimal printing. <b>Editor access required.</b></p>
    
    <div class="input-group">
      <label for="slideUrl">Google Slides URL</label>
      <input type="text" id="slideUrl" placeholder="https://docs.google.com/presentation/d/..." autocomplete="off">
    </div>
    
    <button onclick="fixNotes()" id="runBtn">Fix Speaker Notes</button>
    
    <div class="status-container">
      <div id="statusMessage" class="status-message"></div>
    </div>
  </div>

  <script>
    function fixNotes() {
      const urlInput = document.getElementById('slideUrl');
      const url = urlInput.value.trim();
      const statusDiv = document.getElementById('statusMessage');
      const btn = document.getElementById('runBtn');
      
      if (!url) {
        showStatus('Please enter a Google Slides URL.', 'error');
        return;
      }

      // Show loading state
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Fixing Notes...';
      showStatus('Processing your presentation. This might take a few moments.', 'loading');

      google.script.run
        .withSuccessHandler(function(response) {
          btn.disabled = false;
          btn.innerHTML = 'Fix Speaker Notes';
          
          if (response.success) {
            statusDiv.className = 'status-message success';
            statusDiv.innerHTML = `
              <div>${response.message}</div>
              <a href="${response.url}" target="_blank" class="open-link">Open Fixed Presentation</a>
            `;
          } else {
            showStatus(response.message, 'error');
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          btn.innerHTML = 'Fix Speaker Notes';
          showStatus('An unexpected error occurred. Please try again.', 'error');
        })
        .processSlides(url);
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.className = `status-message ${type}`;
      statusDiv.innerHTML = message;
    }
  </script>
</body>
</html>
